<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shin-chan · Mi Maratón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFD23F; --yellow-2:#FFE680; --red:#EE4035; --blue:#2E7DD7; --green:#3BB273;
  --pink:#FF6FB5; --orange:#FF8C2B; --purple:#8E5CF2; --ink:#2B2118; --paper:#FFFBEF;
  --shadow:4px 4px 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background-color:var(--yellow);
  background-image:
    radial-gradient(circle at 20px 20px, rgba(255,255,255,.35) 3px, transparent 4px),
    radial-gradient(circle at 60px 60px, rgba(238,64,53,.12) 3px, transparent 4px);
  background-size:80px 80px;
}
.hand{font-family:'Gochi Hand','Comic Sans MS',cursive}
button{font-family:inherit;cursor:pointer}

/* ---------- HEADER ---------- */
header{position:relative;overflow:hidden;padding:28px 16px 70px;text-align:center}
.doodle{position:absolute;pointer-events:none;opacity:.9}
.d-sun{top:14px;left:4%;width:90px;animation:spin 24s linear infinite}
.d-cloud{top:30px;right:6%;width:130px;animation:float 6s ease-in-out infinite}
.d-star1{bottom:30px;left:14%;width:36px;animation:twinkle 2.4s ease-in-out infinite}
.d-star2{top:40px;right:28%;width:28px;animation:twinkle 3s ease-in-out infinite .6s}
.d-crayon{bottom:22px;right:10%;width:120px;transform:rotate(-18deg)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes twinkle{50%{transform:scale(.7) rotate(20deg)}}

.title{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:clamp(46px,10vw,104px);line-height:1;position:relative;z-index:1}
.title span{display:inline-block;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);animation:wobble 3s ease-in-out infinite}
.title span:nth-child(odd){animation-delay:-.7s}
.title span:nth-child(3n){animation-delay:-1.4s}
@keyframes wobble{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-6px)}}
.subtitle{font-size:clamp(20px,3.4vw,30px);margin-top:12px;position:relative;z-index:1}
.wave{position:absolute;bottom:-1px;left:0;width:100%;height:50px}

/* ---------- MAIN ---------- */
main{background:var(--paper);min-height:60vh;padding:10px 16px 60px}
.wrap{max-width:1180px;margin:0 auto}

.panel{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);padding:18px;margin-top:-34px;position:relative;z-index:2}
.stats{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:110px;height:110px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px}
.stats h2{font-size:22px}
.stats p{font-size:15px;opacity:.8}
.bar{height:16px;border:3px solid var(--ink);border-radius:20px;background:#f3eedc;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--red) 0 12px,var(--orange) 12px 24px);transition:width .5s}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.btn{border:3px solid var(--ink);border-radius:14px;padding:8px 14px;font-size:16px;font-weight:600;background:var(--yellow);box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:#fff}
.btn.small{font-size:14px;padding:6px 10px;border-radius:11px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:26px 0 14px}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;font:inherit;font-size:17px;padding:11px 16px 11px 44px;border:3px solid var(--ink);border-radius:30px;background:#fff;outline:none;box-shadow:3px 3px 0 var(--ink)}
.search input:focus{background:var(--yellow-2)}
.search::before{content:'🔍';position:absolute;left:15px;top:50%;transform:translateY(-50%)}
.seg{display:flex;border:3px solid var(--ink);border-radius:30px;overflow:hidden;box-shadow:3px 3px 0 var(--ink);background:#fff}
.seg button{border:0;background:none;padding:9px 14px;font-size:15px;font-weight:600}
.seg button+button{border-left:3px solid var(--ink)}
.seg button.on{background:var(--blue);color:#fff}

/* seasons */
.seasons{display:flex;gap:10px;overflow-x:auto;padding:6px 4px 14px;scrollbar-width:thin}
.chip{flex:0 0 auto;min-width:74px;border:3px solid var(--ink);border-radius:16px;background:#fff;padding:6px 10px 8px;text-align:center;box-shadow:3px 3px 0 var(--ink);transition:transform .15s}
.chip:hover{transform:translateY(-3px) rotate(-2deg)}
.chip strong{display:block;font-size:17px}
.chip small{font-size:12px;opacity:.75}
.chip .mini{height:6px;border-radius:6px;background:#eee;margin-top:4px;overflow:hidden}
.chip .mini i{display:block;height:100%;background:var(--green)}
.chip.on{background:var(--c,var(--red));color:#fff}
.chip.on .mini{background:rgba(255,255,255,.4)}
.chip.on .mini i{background:#fff}
.chip.done strong::after{content:' ⭐'}

.season-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 16px}
.season-head h2{font-size:clamp(28px,4vw,40px)}
.count{font-size:16px;opacity:.7}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{--c:var(--red);background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);display:flex;flex-direction:column;overflow:hidden;transition:transform .15s,box-shadow .15s;animation:pop .35s ease both}
.card:nth-child(4n+1){transform:rotate(-.6deg)}
.card:nth-child(4n+3){transform:rotate(.6deg)}
.card:hover{transform:translateY(-4px) rotate(0);box-shadow:8px 8px 0 var(--ink)}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.card-top{background:var(--c);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--ink);position:relative}
.card-top::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 8px 8px,rgba(255,255,255,.22) 2px,transparent 3px);background-size:16px 16px;pointer-events:none}
.num{font-size:26px;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink)}
.stars-mini{font-size:14px;letter-spacing:1px}
.card-body{padding:12px 14px;flex:1}
.card-body ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.card-body li{font-size:15.5px;line-height:1.3;padding-left:20px;position:relative}
.card-body li::before{content:'✏️';position:absolute;left:0;font-size:12px;top:2px}
.card-body mark{background:var(--yellow-2);border-radius:4px;padding:0 2px}
.card-foot{display:flex;gap:8px;padding:10px 12px 12px;border-top:2px dashed #ddd}
.play{flex:1;text-align:center;text-decoration:none;color:#fff}
.tick{width:46px;font-size:20px;padding:6px 0 !important}
.card.seen{background:#F1FFF5}
.card.seen .card-top{background:var(--green)}
.card.seen .tick{background:var(--green);color:#fff}
.card.seen .num::after{content:' ✓'}
.card.next{outline:4px dashed var(--blue);outline-offset:4px}

.empty{text-align:center;padding:50px 10px;font-size:22px}
.sentinel{height:40px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(43,33,24,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.sheet{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--ink);width:100%;max-width:520px;padding:22px;animation:pop .25s ease}
.sheet h3{font-size:26px}
.sheet .sub{opacity:.7;font-size:14px;margin:4px 0 12px}
.rate{display:flex;gap:6px;font-size:34px;margin-bottom:10px}
.rate button{background:none;border:0;filter:grayscale(1);opacity:.4;transition:transform .1s}
.rate button.on{filter:none;opacity:1}
.rate button:hover{transform:scale(1.2) rotate(-10deg)}
.sheet textarea{width:100%;height:150px;font:inherit;font-size:16px;padding:12px;border:3px solid var(--ink);border-radius:14px;resize:vertical;background:#fff;outline:none}
.sheet .row{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-weight:600;transition:transform .3s;z-index:60;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}

footer{text-align:center;padding:24px 16px 40px;background:var(--paper);font-size:14px;opacity:.75}
.confetti{position:fixed;top:-20px;width:12px;height:16px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (max-width:560px){
  .stats{grid-template-columns:1fr;justify-items:center;text-align:center}
  .actions{justify-content:center}
  .d-sun{width:60px}.d-cloud{width:90px}.d-crayon{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <div class="toolbar">

  <section class="grid" id="grid"></section>
  <div class="sentinel" id="sentinel"></div>

</div>

<footer class="hand">Tu progreso se guarda en este navegador · Haz una copia de seguridad de vez en cuando 💾</footer>

</div>

/* ================= GUARDADO ================= */
const KEY = 'shinchan_maraton_v2';
let state = { w:{}, r:{} };           // w: vistos {clave: fecha}, r: reseñas {clave:{s,t}}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) state = Object.assign({w:{},r:{}}, JSON.parse(raw)); }catch(e){}
  migrateOld();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('⚠️ No se ha podido guardar. Haz una copia de seguridad.'); }
}
// Recupera lo que tuvieras marcado en la versión anterior (solo IDs que no estaban repetidos)
function migrateOld(){
  try{
    if(localStorage.getItem(KEY+'_migrated')) return;
    let n=0;
    EPISODES.forEach(e=>{
      if(!e.o) return;
      if(localStorage.getItem('watched_'+e.o)==='true' && !state.w[e.k]){ state.w[e.k]=Date.now(); n++; }
      const rv = localStorage.getItem('review-'+e.o);
      if(rv && !state.r[e.k]) state.r[e.k]={s:0,t:rv};
    });
    localStorage.setItem(KEY+'_migrated','1');
    save();
    if(n) setTimeout(()=>toast(`🎉 He recuperado ${n} capítulos que ya tenías marcados`),800);
  }catch(e){}
}
// Pide al navegador que no borre estos datos aunque falte espacio
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }

EPISODES.forEach((e,i)=>{ e.i=i; if(!seasons.includes(e.s)) seasons.push(e.s); });

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function hl(text, q){
  const safe = esc(text);
  if(!q) return safe;
  const n = norm(text), idx = n.indexOf(q);
  if(idx<0) return safe;
  return esc(text.slice(0,idx))+'<mark>'+esc(text.slice(idx,idx+q.length))+'</mark>'+esc(text.slice(idx+q.length));
}
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
function confetti(){
  const cols=['#EE4035','#2E7DD7','#3BB273','#FFD23F','#FF6FB5','#8E5CF2'];
  for(let i=0;i<70;i++){
    const d=document.createElement('div'); d.className='confetti';
    d.style.left=Math.random()*100+'vw'; d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.6+Math.random()*1.8)+'s'; d.style.animationDelay=(Math.random()*.4)+'s';
    d.style.borderRadius=Math.random()>.5?'50%':'3px';
    document.body.appendChild(d); setTimeout(()=>d.remove(),4200);
  }
}
const nextUnwatched = (pool=EPISODES) => pool.find(e=>!state.w[e.k]);

/* ================= PINTAR ================= */
function renderStats(){
  const total=EPISODES.length, seen=EPISODES.filter(e=>state.w[e.k]).length;
  const p = total ? Math.round(seen/total*1000)/10 : 0;
  $('pct').textContent = (p%1?p.toFixed(1):p)+'%';
  $('ringArc').style.strokeDashoffset = 314 - 314*seen/total;
  $('barFill').style.width = (seen/total*100)+'%';
  $('statText').textContent = `${seen} de ${total} vistos · te quedan ${total-seen}`;
  $('statTitle').textContent = seen===0 ? '¡Empieza la maratón!' : seen===total ? '¡¡Lo has visto TODO!! 🏆' : p<25 ? '¡Buen comienzo! 💪' : p<50 ? '¡Vas fenomenal! 🔥' : p<75 ? '¡Más de la mitad! 🚀' : '¡Ya casi lo tienes! 🌟';
}
function renderSeasons(){
  const nav=$('seasons');
  const all=['all',...seasons];
  nav.innerHTML = all.map(s=>{
    const eps = s==='all'?EPISODES:EPISODES.filter(e=>e.s===s);
    const seen = eps.filter(e=>state.w[e.k]).length;
    const done = seen===eps.length && eps.length>0;
    return `<button class="chip ${view.season===s?'on':''} ${done?'done':''}" data-s="${s}" style="--c:${s==='all'?'#2B2118':colorOf(s)}">
      <strong class="hand">${s==='all'?'⭐ Todas':chipLabel(s)}</strong><small>${seen}/${eps.length}</small>
      <div class="mini"><i style="width:${eps.length?seen/eps.length*100:0}%"></i></div></button>`;
  }).join('');
}
function cardHTML(e, q, nextKey){
  const seen = !!state.w[e.k], r = state.r[e.k];
  const parts = e.t.split(/\s*\/\s*/).filter(Boolean);
  const stars = r && r.s ? '⭐'.repeat(r.s) : (r && r.t ? '📝' : '');
  return `<article class="card ${seen?'seen':''} ${e.k===nextKey?'next':''}" style="--c:${colorOf(e.s)}" data-k="${e.k}">
    <div class="card-top"><span class="num hand">${esc(e.n)}</span><span class="stars-mini">${stars}</span></div>
    <div class="card-body"><ul>${parts.map(p=>`<li>${hl(p,q)}</li>`).join('')}</ul></div>
    <div class="card-foot">
      <a class="btn red small play" href="${esc(e.u)}" target="_blank" rel="noopener" data-act="play">▶ Ver</a>
      <button class="btn ghost small" data-act="review" title="Reseña">✍️</button>
      <button class="btn ghost small tick" data-act="toggle" title="${seen?'Desmarcar':'Marcar como visto'}">${seen?'✓':'○'}</button>
    </div></article>`;
}
function buildList(){
  const q = norm(view.q.trim()).replace(/\s+/g,' ');
  const qCode = q.replace(/\s/g,'');
  list = EPISODES.filter(e=>{
    if(view.season!=='all' && e.s!==view.season) return false;
    if(view.filter==='seen' && !state.w[e.k]) return false;
    if(view.filter==='todo' && state.w[e.k]) return false;
    if(!q) return true;
    return norm(e.t).includes(q) || norm(e.k).includes(qCode) || norm(e.n).replace(/\s/g,'').includes(qCode);
  });
  return q;
}
let curQ='';
function render(){
  curQ = buildList();
  shown = 0;
  $('grid').innerHTML='';
  $('viewTitle').textContent = seasonName(view.season);
  $('viewCount').textContent = `${list.length} ${list.length===1?'resultado':'resultados'}`;
  const isSeason = view.season!=='all';
  $('btnMarkAll').style.display = $('btnUnmarkAll').style.display = isSeason ? '' : 'none';
  if(!list.length){ $('grid').innerHTML = `<div class="empty hand">🙈 Aquí no hay nada… prueba otra búsqueda</div>`; return; }
  more();
}
function more(){
  if(shown>=list.length) return;
  const nextKey = (nextUnwatched()||{}).k;
  const slice = list.slice(shown, shown+PAGE);
  $('grid').insertAdjacentHTML('beforeend', slice.map(e=>cardHTML(e,curQ,nextKey)).join(''));
  shown += slice.length;
}
function refreshCard(k){
  const el = document.querySelector(`.card[data-k="${k}"]`); if(!el) return;
  const e = EPISODES.find(x=>x.k===k);
  const nextKey=(nextUnwatched()||{}).k;
  el.outerHTML = cardHTML(e,curQ,nextKey);
  document.querySelectorAll('.card.next').forEach(c=>{ if(c.dataset.k!==nextKey) c.classList.remove('next'); });
  const n = document.querySelector(`.card[data-k="${nextKey}"]`); if(n) n.classList.add('next');
}
function refreshAll(){ renderStats(); renderSeasons(); }

/* ================= ACCIONES ================= */
function toggle(k, force){
  const was = !!state.w[k];
  const now = force===undefined ? !was : force;
  if(now) state.w[k]=Date.now(); else delete state.w[k];
  save(); refreshCard(k); refreshAll();
  const e = EPISODES.find(x=>x.k===k);
  if(now && !was){
    const eps = EPISODES.filter(x=>x.s===e.s);
    if(eps.every(x=>state.w[x.k])){ confetti(); toast(`🏆 ¡${seasonName(e.s)} completada!`); }
    else toast(`✓ ${e.n} marcado como visto`);
  }
}
function goTo(e, open){
  view.season = e.s; view.q=''; $('search').value='';
  if(view.filter==='seen') setFilter('all', false);
  render(); refreshAll();
  const idx = list.findIndex(x=>x.k===e.k);
  while(shown<=idx) more();
  const el = document.querySelector(`.card[data-k="${e.k}"]`);
  if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.animate([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:600,iterations:2}); }
  if(open) window.open(e.u,'_blank','noopener');
}
function setFilter(f, rerender=true){
  view.filter=f;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));
  if(rerender) render();
}

$('grid').addEventListener('click', ev=>{
  const btn = ev.target.closest('[data-act]'); if(!btn) return;
  const k = btn.closest('.card').dataset.k;
  if(btn.dataset.act==='toggle') toggle(k);
  if(btn.dataset.act==='review') openReview(k);
  if(btn.dataset.act==='play' && !state.w[k]){
    setTimeout(()=>{ toast('¿Ya lo has visto? Pulsa ○ para marcarlo'); },400);
  }
});
$('seasons').addEventListener('click', ev=>{
  const c = ev.target.closest('.chip'); if(!c) return;
  view.season = c.dataset.s; render(); renderSeasons();
  c.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
});
$('seg').addEventListener('click', ev=>{ const b=ev.target.closest('button'); if(b) setFilter(b.dataset.f); });
let sT; $('search').addEventListener('input', ev=>{ clearTimeout(sT); sT=setTimeout(()=>{ view.q=ev.target.value; render(); },150); });

$('btnNext').onclick = ()=>{
  const e = nextUnwatched();
  if(!e){ confetti(); return toast('🏆 ¡Ya lo has visto todo!'); }
  goTo(e,false); toast(`Te toca: ${e.n}`);
};
$('btnRandom').onclick = ()=>{
  let pool = EPISODES.filter(e=>(view.season==='all'||e.s===view.season) && !state.w[e.k]);
  if(!pool.length) pool = EPISODES.filter(e=>view.season==='all'||e.s===view.season);
  const e = pool[Math.floor(Math.random()*pool.length)];
  toast(`🎲 ¡Te ha tocado ${e.n}!`); goTo(e,true);
};
$('btnMarkAll').onclick = ()=>{
  const eps = EPISODES.filter(e=>e.s===view.season);
  if(!confirm(`¿Marcar los ${eps.length} de ${seasonName(view.season)} como vistos?`)) return;
  eps.forEach(e=>{ if(!state.w[e.k]) state.w[e.k]=Date.now(); }); save(); render(); refreshAll(); confetti();
};
$('btnUnmarkAll').onclick = ()=>{
  const eps = EPISODES.filter(e=>e.s===view.season);
  if(!confirm(`¿Desmarcar todos los de ${seasonName(view.season)}?`)) return;
  eps.forEach(e=>delete state.w[e.k]); save(); render(); refreshAll();
};

/* ---- copia de seguridad ---- */
$('btnExport').onclick = ()=>{
  const blob = new Blob([JSON.stringify({app:'shinchan-maraton',v:2,fecha:new Date().toISOString(),...state},null,1)],{type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download = `shinchan-progreso-${new Date().toISOString().slice(0,10)}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('💾 Copia descargada. ¡Guárdala bien!');
};
$('btnImport').onclick = ()=>$('fileImport').click();
$('fileImport').onchange = ev=>{
  const f = ev.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const d = JSON.parse(rd.result);
      if(!d.w) throw 0;
      state.w = Object.assign({}, state.w, d.w); state.r = Object.assign({}, state.r, d.r||{});
      save(); render(); refreshAll(); toast(`📂 Copia restaurada (${Object.keys(d.w).length} vistos)`);
    }catch(e){ toast('⚠️ Ese archivo no es una copia válida'); }
    ev.target.value='';
  };
  rd.readAsText(f);
};

/* ---- reseñas ---- */
let mKey=null, mStars=0;
function drawRate(){ $('rate').innerHTML=[1,2,3,4,5].map(n=>`<button data-n="${n}" class="${n<=mStars?'on':''}" aria-label="${n} estrellas">⭐</button>`).join(''); }
$('rate').onclick = ev=>{ const b=ev.target.closest('button'); if(!b) return; const n=+b.dataset.n; mStars = mStars===n?0:n; drawRate(); };
function openReview(k){
  const e = EPISODES.find(x=>x.k===k); mKey=k;
  const r = state.r[k]||{s:0,t:''}; mStars=r.s||0;
  $('mTitle').textContent = 'Reseña · '+e.n; $('mSub').textContent = e.t; $('mText').value=r.t||''; drawRate();
  $('modal').classList.add('open'); setTimeout(()=>$('mText').focus(),50);
}
function closeReview(){ $('modal').classList.remove('open'); mKey=null; }
$('mSave').onclick = ()=>{
  const t = $('mText').value.trim();
  if(!t && !mStars) delete state.r[mKey]; else state.r[mKey]={s:mStars,t};
  save(); refreshCard(mKey); closeReview(); toast('✍️ Reseña guardada');
};
$('mDelete').onclick = ()=>{ delete state.r[mKey]; save(); refreshCard(mKey); closeReview(); };
$('mClose').onclick = closeReview;
$('modal').onclick = ev=>{ if(ev.target.id==='modal') closeReview(); };
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape') closeReview(); });

/* ---- scroll infinito ---- */
new IntersectionObserver(en=>{ if(en[0].isIntersecting) more(); },{rootMargin:'600px'}).observe($('sentinel'));

/* ---- si se abre en otra pestaña a la vez, se sincroniza ---- */
window.addEventListener('storage', ev=>{ if(ev.key===KEY){ load(); render(); refreshAll(); } });

/* ================= INICIO ================= */
load(); render(); refreshAll();
</script>
</body>
</html>
